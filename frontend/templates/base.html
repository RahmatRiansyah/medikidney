<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediKidney - Diagnosis AI</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-light">

<!-- ===================== NAVBAR ===================== -->
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
  <div class="container">

    <!-- LOGO -->
    <a class="navbar-brand d-flex align-items-center fw-bold" href="{{ url_for('home') }}">
      <i class="fas fa-heartbeat text-primary me-2 fa-lg"></i>
      MediKidney
    </a>

    <!-- TOGGLER -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- MENU -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center gap-2">

        {% if current_user.is_authenticated %}

          <!-- USER INFO -->
          <li class="nav-item text-muted small me-3 d-none d-lg-block">
            <i class="fas fa-user-md me-1"></i>
            {{ current_user.username }}
          </li>

          <!-- HISTORY -->
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('view_history') }}">
              <i class="fas fa-clock me-1"></i> Riwayat
            </a>
          </li>

          <!-- PREDICT -->
          <li class="nav-item">
            <a class="btn btn-dark px-4" href="{{ url_for('predict') }}">
              Mulai Diagnosis
            </a>
          </li>

          <!-- LOGOUT -->
          <li class="nav-item">
            <a class="btn btn-outline-danger btn-sm" href="{{ url_for('logout') }}">
              <i class="fas fa-sign-out-alt me-1"></i> Logout
            </a>
          </li>

        {% else %}

          <!-- LOGIN -->
          <li class="nav-item">
            <a class="btn btn-dark px-4" href="{{ url_for('login') }}">
              <i class="fas fa-sign-in-alt me-1"></i> Login Dokter
            </a>
          </li>

        {% endif %}

      </ul>
    </div>
  </div>
</nav>

<!-- SPACER NAVBAR -->
<div style="height:80px;"></div>

<!-- ===================== PAGE CONTENT ===================== -->
{% block content %}{% endblock %}

<!-- ===================== FOOTER ===================== -->
<footer class="py-4 mt-5 bg-white border-top">
  <div class="container text-center text-muted small">
    &copy; 2025 <strong>MediKidney</strong> — Sistem Diagnosis AI Ginjal  
    <br>
    Dikembangkan oleh Rahmat Riansyah
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
